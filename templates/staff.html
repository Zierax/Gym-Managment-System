{% extends 'base.html' %}

{% block title %}Gym Staff{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Staff List</h5>
        <a href="{{ url_for('add_staff') }}" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i> Add Staff
        </a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Phone</th>
                        <th>Hire Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for person in staff %}
                    <tr>
                        <td>{{ person.name }}</td>
                        <td>{{ person.role }}</td>
                        <td>{{ person.phone }}</td>
                        <td>{{ person.hire_date.strftime('%Y-%m-%d') }}</td>
                        <td>
                            <a href="{{ url_for('edit_staff', id=person.id) }}" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a href="{{ url_for('delete_staff', id=person.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
