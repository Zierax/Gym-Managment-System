{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-white">
        <h5 class="mb-0">Exercise Details</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Exercise Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ exercise.name if exercise else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category">
                    <option value="Strength" {% if exercise and exercise.category == 'Strength' %}selected{% endif %}>Strength</option>
                    <option value="Cardio" {% if exercise and exercise.category == 'Cardio' %}selected{% endif %}>Cardio</option>
                    <option value="Flexibility" {% if exercise and exercise.category == 'Flexibility' %}selected{% endif %}>Flexibility</option>
                    <option value="HIIT" {% if exercise and exercise.category == 'HIIT' %}selected{% endif %}>HIIT</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ exercise.description if exercise else '' }}</textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('exercises') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Exercise</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
