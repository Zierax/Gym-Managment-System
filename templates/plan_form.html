{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-white">
        <h5 class="mb-0">{{ title }} Details</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Plan Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ plan.name if plan else '' }}" placeholder="e.g. Gold Monthly" required>
            </div>
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="price" class="form-label">Price ($)</label>
                    <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ plan.price if plan else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="duration_days" class="form-label">Duration (Days)</label>
                    <input type="number" class="form-control" id="duration_days" name="duration_days" value="{{ plan.duration_days if plan else '' }}" required>
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('plans') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Plan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
