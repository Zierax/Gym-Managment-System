{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-white">
        <h5 class="mb-0">Equipment Details</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Equipment Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ item.name if item else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="condition" class="form-label">Condition</label>
                <select class="form-select" id="condition" name="condition">
                    <option value="Good" {% if item and item.condition == 'Good' %}selected{% endif %}>Good</option>
                    <option value="Needs Repair" {% if item and item.condition == 'Needs Repair' %}selected{% endif %}>Needs Repair</option>
                    <option value="Broken" {% if item and item.condition == 'Broken' %}selected{% endif %}>Broken</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" id="location" name="location" value="{{ item.location if item else '' }}" placeholder="e.g. Area A, Cardio Zone">
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('equipment') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Equipment</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
